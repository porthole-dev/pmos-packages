# Check the signing keys, the documentation links and the commits on pushes to
# main, pull requests and merge groups.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull request runs are cancelled; every push to main keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Signing keys are RSA public keys
        run: |
          set -- keys/*.rsa.pub
          if [ ! -e "$1" ]; then echo "::error::no keys/*.rsa.pub found"; exit 1; fi
          for key; do
            openssl rsa -pubin -noout -in "$key" || { echo "::error file=$key::not a valid RSA public key"; exit 1; }
            echo "ok: $key"
          done
      - name: Relative links in Markdown resolve
        shell: python
        run: |
          import pathlib, re, sys
          fail = 0
          for md in sorted(pathlib.Path(".").rglob("*.md")):
              if ".git" in md.parts:
                  continue
              text = re.sub(r"(?ms)^```.*?^```", "", md.read_text())
              for target in re.findall(r"\]\(([^)\s]+)\)", text):
                  if re.match(r"[a-z][a-z0-9+.-]*:|#", target):
                      continue
                  path = (md.parent / target.split("#")[0]).resolve()
                  if not path.exists():
                      print(f"::error file={md}::broken link: {target}")
                      fail = 1
          sys.exit(fail)

  commit-check:
    name: Commit check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: porthole-dev/.github/actions/commit-check@b4f7bd46f772860e6f825139e2cff7d3b25d898c # v1.0.1

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: porthole-dev/.github/actions/workflow-lint@b4f7bd46f772860e6f825139e2cff7d3b25d898c # v1.0.1

  ci-passed:
    name: CI passed
    if: ${{ !cancelled() }}
    needs: [lint, commit-check, workflow-lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: porthole-dev/.github/actions/ci-passed@b4f7bd46f772860e6f825139e2cff7d3b25d898c # v1.0.1
        with:
          results: ${{ join(needs.*.result, ' ') }}
